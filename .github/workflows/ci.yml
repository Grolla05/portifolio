name: CI

# Roda em todo PR e em todo push nas branches principais. Os jobs abaixo são os
# "checks" que a branch protection de `main` deve exigir para liberar o merge.
on:
  pull_request:
  push:
    branches: [main, DEV]

# Novo push no mesmo PR/branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio possível: o CI só precisa ler o código.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` respeita o package-lock.json à risca (instalação reprodutível).
      - name: Instalar dependências
        run: npm ci

      # `next build` está com `ignoreBuildErrors: true`, então o tsc é a única
      # barreira real contra erros de tipo.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes (vitest)
        run: npm test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O build pré-renderiza /projects/[slug] buscando dados na API do GitHub;
      # sem token o limite anônimo (60 req/h) estoura com facilidade.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
